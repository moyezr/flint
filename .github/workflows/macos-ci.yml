name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build the release binary for macOS 14
        run: MACOSX_DEPLOYMENT_TARGET=14.0 swift build -c release

      - name: Verify the release deployment target
        run: |
          minimum_os="$(otool -l .build/release/Flint | awk '/LC_BUILD_VERSION/ { found=1; next } found && /minos/ { print $2; exit }')"
          test "$minimum_os" = "14.0"
