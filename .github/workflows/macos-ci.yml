name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install landing dependencies
        run: npm ci --prefix landing

      - name: Test landing
        run: npm run landing:test

      - name: Lint landing
        run: npm run landing:lint

      - name: Build landing
        run: npm run landing:build

  native:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test
        working-directory: app

      - name: Build the release binary for macOS 14
        run: MACOSX_DEPLOYMENT_TARGET=14.0 swift build -c release
        working-directory: app

      - name: Verify the release deployment target
        run: |
          minimum_os="$(otool -l app/.build/release/Flint | awk '/LC_BUILD_VERSION/ { found=1; next } found && /minos/ { print $2; exit }')"
          test "$minimum_os" = "14.0"
